# MCUboot is the first-stage bootloader at 0x0 (PCA10059 bare board).
CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_PIN_RESET=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_CONSOLE=n
CONFIG_USB_DEVICE_PRODUCT="OLFs MCUboot Recovery"
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_FPROTECT=y
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0002
