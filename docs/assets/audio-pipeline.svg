<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">Audio-Pipeline pro Millisekunde</title><desc id="desc">SOF, Frame-Pacing, Snapshot der Einstellungen, Stereo-Rendering, PCM-Packing und USB-Übertragung mit vier Slab-Puffern.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5b7293"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#16283f}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#4d637c}.line{fill:none;stroke:#5b7293;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f1f6fc;stroke:#c7d6e7;stroke-width:1.5}</style><rect width="100%" height="100%" rx="20" fill="#fff"/><text class="small" x="28" y="30">EIN USB-FULL-SPEED-FRAME · 1 ms</text><rect class="box" x="28" y="65" width="248" height="92" rx="14" style="fill:#f1f6fc"/><text class="label" x="48" y="99">SOF</text><text class="small" x="48" y="124">Streaming aktiv?</text><rect class="box" x="300" y="65" width="248" height="92" rx="14" style="fill:#f1f6fc"/><text class="label" x="320" y="99">Pacing + Snapshot</text><text class="small" x="320" y="124">44/45, 48 oder 96 Frames</text><rect class="box" x="572" y="65" width="248" height="92" rx="14" style="fill:#e4f8f3"/><text class="label" x="592" y="99">Rendern</text><text class="small" x="592" y="124">L/R · int32_t mit 24 Bit</text><rect class="box" x="844" y="65" width="248" height="92" rx="14" style="fill:#e4f8f3"/><text class="label" x="864" y="99">Packen + Senden</text><text class="small" x="864" y="124">16/24 Bit · interleaved</text><path class="line" d="M276 111H300"/><path class="line" d="M548 111H572"/><path class="line" d="M820 111H844"/><rect class="box" x="300" y="224" width="248" height="82" rx="14" style="fill:#f1f6fc"/><text class="label" x="320" y="258">Kurzer Spinlock</text><text class="small" x="320" y="283">Kopie der Shell-Einstellungen</text><rect class="box" x="572" y="224" width="248" height="82" rx="14" style="fill:#f1f6fc"/><text class="label" x="592" y="258">Phasenakkumulator</text><text class="small" x="592" y="283">Bleibt über Pakete erhalten</text><rect class="box" x="844" y="224" width="248" height="82" rx="14" style="fill:#f1f6fc"/><text class="label" x="864" y="258">4 Slab-Puffer</text><text class="small" x="864" y="283">Freigabe im Release-Callback</text><path class="line" d="M424 224V157"/><path class="line" d="M696 224V157"/><path class="line" d="M968 157V224"/><text class="small" x="28" y="344">Kein freier Puffer / Senden fehlgeschlagen → dropped++; Phase wurde bereits fortgeschrieben.</text></svg>