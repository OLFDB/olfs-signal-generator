<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc"><title id="title">Flash-Layout beim originalen Open Bootloader</title><desc id="desc">MBR von 0 bis 0x1000, Anwendung bis 0xe0000, danach originaler Bootloader und Settings. UICR bleibt außerhalb des Images.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5b7293"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#16283f}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#4d637c}.line{fill:none;stroke:#5b7293;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f1f6fc;stroke:#c7d6e7;stroke-width:1.5}</style><rect width="100%" height="100%" rx="20" fill="#fff"/><text class="small" x="32" y="36">FLASH · 1 MiB · SCHEMATISCHE DARSTELLUNG</text><rect class="box" x="32" y="76" width="160" height="102" rx="14" style="fill:#edf1f7"/><text class="label" x="52" y="110">MBR</text><text class="small" x="52" y="135">4 KiB · erhalten</text><rect class="box" x="200" y="76" width="638" height="102" rx="14" style="fill:#e4f8f3"/><text class="label" x="220" y="110">Anwendung</text><text class="small" x="220" y="135">892 KiB verfügbar · enthält 512 KiB Tools-Image</text><rect class="box" x="846" y="76" width="242" height="102" rx="14" style="fill:#fff4df"/><text class="label" x="866" y="110">Open Bootloader</text><text class="small" x="866" y="135">inkl. Settings · erhalten</text><text class="small" x="32" y="205">0x00000</text><text class="small" x="200" y="205">0x01000</text><text class="small" x="846" y="205">0xe0000</text><text class="small" x="1000" y="205">0x100000</text><text class="label" x="32" y="260">Anwendungs-HEX und DFU-ZIP schreiben ausschließlich den Anwendungsbereich.</text><text class="small" x="32" y="290">Kein Ersatz-Bootloader · keine UICR-Daten · keine erzwungene Signaturprüfung</text></svg>