<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Systemarchitektur</title><desc id="desc">Audio fließt vom Generator über UAC2 zum Rechner. CDC0 steuert, CDC1 protokolliert. MSC liest ein FAT12-Image aus Flash.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5b7293"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#16283f}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#4d637c}.line{fill:none;stroke:#5b7293;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f1f6fc;stroke:#c7d6e7;stroke-width:1.5}</style><rect width="100%" height="100%" rx="20" fill="#fff"/><text class="small" x="32" y="30">RECHNER</text><text class="small" x="470" y="30">nRF52840 · ZEPHYR USB-NEXT</text><rect class="box" x="32" y="60" width="280" height="86" rx="14" style="fill:#f1f6fc"/><text class="label" x="52" y="94">Audio-App</text><text class="small" x="52" y="119">Aufnahme · Rate &amp; Format</text><rect class="box" x="32" y="160" width="280" height="86" rx="14" style="fill:#f1f6fc"/><text class="label" x="52" y="194">Terminal / olfctl</text><text class="small" x="52" y="219">Generatorsteuerung</text><rect class="box" x="32" y="260" width="280" height="86" rx="14" style="fill:#f1f6fc"/><text class="label" x="52" y="294">Dateimanager</text><text class="small" x="52" y="319">Native Clients kopieren</text><rect class="box" x="464" y="60" width="270" height="86" rx="14" style="fill:#e4f8f3"/><text class="label" x="484" y="94">UAC2 · ISO IN</text><text class="small" x="484" y="119">Stereo PCM → Rechner</text><rect class="box" x="464" y="160" width="270" height="86" rx="14" style="fill:#f1f6fc"/><text class="label" x="484" y="194">CDC 0 · OLF Shell</text><text class="small" x="484" y="219">Befehle &amp; Antworten</text><rect class="box" x="464" y="260" width="270" height="86" rx="14" style="fill:#fff4df"/><text class="